log_level: INFO
interval: 10

credentials_file: config/credentials.yaml

jenkins:
  url: http://localhost:8080
  user: admin
  verify_ssl: false

storage:
  type: csv
  path: data/test_metrics

notifications:
  email:
    enabled: false

remediation:
  enabled: true
  dry_run: false
  whitelist:
    - jenkins
  max_daily_restarts: 2

thresholds:
  - metric: cpu_percent
    warning: 70
    critical: 85
    emergency: 95
    window_size: 2
    window_type: consecutive
  - metric: memory_percent
    warning: 75
    critical: 90
    emergency: 95
    window_size: 2
    window_type: average
  - metric: disk_percent
    warning: 80
    critical: 90
    emergency: 95
    window_size: 2
    window_type: consecutive

web:
  enabled: false

nodes: config/nodes.test.yaml
