log_level: INFO
interval: 60

credentials_file: config/credentials.yaml

jenkins:
  url: https://jenkins.example.com
  user: admin
  verify_ssl: true

smtp:
  host: smtp.gmail.com
  port: 587
  user: alerts@example.com
  from_addr: alerts@example.com
  to_addrs:
    - admin@example.com
  use_tls: true

storage:
  type: csv
  path: data/metrics
  # Optional InfluxDB settings
  influx_url: http://localhost:8086
  influx_org: my-org
  influx_bucket: infra

notifications:
  email:
    enabled: true
    on_severity: [WARNING, CRITICAL, EMERGENCY]

remediation:
  enabled: false
  dry_run: true
  whitelist:
    - jenkins
    - docker
    - sshd
  max_daily_restarts: 2

thresholds:
  - metric: cpu_percent
    warning: 70
    critical: 85
    emergency: 95
    window_size: 3
    window_type: consecutive
  - metric: memory_percent
    warning: 75
    critical: 90
    emergency: 95
    window_size: 3
    window_type: average
  - metric: disk_percent
    warning: 80
    critical: 90
    emergency: 95
    window_size: 2
    window_type: consecutive
  - metric: load_1
    warning: 4.0
    critical: 8.0
    emergency: 15.0
    window_size: 3
    window_type: average
  - metric: swap_percent
    warning: 30
    critical: 60
    emergency: 90
    window_size: 3
    window_type: consecutive
  - metric: zombie_count
    warning: 5
    critical: 20
    emergency: 50
    window_size: 2
    window_type: consecutive

web:
  enabled: true
  host: 0.0.0.0
  port: 5000

nodes: config/nodes.yaml
